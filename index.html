<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studyplan</title>
<style>
:root{--bg:#f6f7f4;--ink:#1b2a2f;--muted:#5d6b6f;--line:#d9ddd6;--card:#fff;--learn:#1f6f5c;--review:#a8730a;--mock:#a23b3b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191b;--ink:#e8ece8;--muted:#97a3a2;--line:#2a3639;--card:#182124;--learn:#4fb89c;--review:#e0b84c;--mock:#e07a7a;--on:#0b1514}}
:root[data-theme="dark"]{--bg:#12191b;--ink:#e8ece8;--muted:#97a3a2;--line:#2a3639;--card:#182124;--learn:#4fb89c;--review:#e0b84c;--mock:#e07a7a;--on:#0b1514}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Iowan Old Style","Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:44px 20px 96px}
h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;max-width:58ch}
form{display:grid;gap:14px;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);padding:20px;border-radius:6px}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font:600 .85rem system-ui,sans-serif;color:var(--muted)}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;font-size:.95rem}
button{font:600 1rem system-ui,sans-serif;padding:12px 18px;border:0;border-radius:4px;background:var(--learn);color:var(--on);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--review);outline-offset:2px}
.msg{font:.95rem system-ui,sans-serif;margin:14px 0 0;color:var(--muted)}.err{color:var(--mock)}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 4px;font:600 .95rem system-ui,sans-serif}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.track i{display:block;height:100%;width:0;background:var(--learn);transition:width .3s}
.day{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.day h3{margin:0;font:600 .95rem system-ui,sans-serif}.day small{color:var(--muted);font-weight:400}
.task{display:flex;gap:10px;align-items:flex-start;padding:4px 0 4px 12px;border-left:4px solid var(--learn);margin-bottom:6px}
.task.review{border-color:var(--review)}.task.mock{border-color:var(--mock)}
.task input{width:auto;margin-top:5px}.task label{display:flex;gap:10px;flex:1;font:inherit;color:var(--ink);align-items:flex-start}
.task span{flex:1}.task em{font:.85rem system-ui,sans-serif;color:var(--muted);font-style:normal;white-space:nowrap}
.task.done span{text-decoration:line-through;color:var(--muted)}
details{margin-top:28px;font:.95rem system-ui,sans-serif}summary{cursor:pointer;font-weight:600}
details p{margin:8px 0;color:var(--muted)}
@media (max-width:600px){form{grid-template-columns:1fr}.day{grid-template-columns:1fr;gap:6px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<main>
<h1>Dal materiale all’esame, giorno per giorno.</h1>
<p class="lead">Carica PDF, slide PowerPoint, documenti Word o appunti, indica la data dell’esame: ricevi un piano con ripassi distribuiti nel tempo.</p>
<form id="f">
<label class="full">Nome dell’esame<input id="title" required placeholder="Es. Biologia cellulare"></label>
<label>Data dell’esame<input id="date" type="date" required></label>
<label>Minuti di studio al giorno<input id="mins" type="number" min="15" step="5" value="90"></label>
<label class="full">Materiale di studio<textarea id="text" required placeholder="Incolla qui il testo di slide, dispense o appunti…"></textarea></label>
<label class="full">Carica i materiali (PDF, DOCX, PPTX, TXT, MD: anche più file)<input id="file" type="file" multiple accept=".pdf,.docx,.pptx,.txt,.md"></label>
<button class="full" id="go">Crea il piano di studio</button>
</form>
<p class="msg" id="msg" role="status"></p>
<section id="out" hidden>
<div class="bar"><span id="what"></span><span id="count"></span></div>
<div class="track"><i id="prog"></i></div>
<div id="plan"></div>
<details><summary>Concetti individuati</summary><div id="cons"></div></details>
</section>
</main>
<script>
// INCOLLA QUI L'URL DEL TUO CLOUDFLARE WORKER:
const WORKER_URL = 'https://INSERISCI-QUI-IL-TUO-URL.workers.dev';

const $=id=>document.getElementById(id);
let tasks=[],concepts=[],today;
$('date').min=new Date(Date.now()+864e5).toISOString().slice(0,10);
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const unxml=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function readFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='pdf'){
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();out.push('[p.'+i+'] '+c.items.map(x=>x.str).join(' '))}
    return out.join('\n');
  }
  if(ext==='docx')return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
  if(ext==='pptx'){
    const z=await JSZip.loadAsync(await f.arrayBuffer());
    const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]),out=[];
    for(const [i,n] of names.entries()){const x=await z.files[n].async('string');out.push('[slide '+(i+1)+'] '+unxml([...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(' ')))}
    return out.join('\n');
  }
  if(ext==='doc'||ext==='ppt')throw new Error('Il formato .'+ext+' non è supportato: salva il file come .'+ext+'x.');
  return await f.text();
}
$('file').addEventListener('change',async e=>{
  const msg=$('msg');msg.className='msg';let all='';
  try{
    for(const f of e.target.files){
      msg.textContent='Leggo '+f.name+'…';
      const t=(await readFile(f)).trim();
      if(t.length<50)throw new Error(f.name+': non trovo testo (se è una scansione, serve il riconoscimento OCR).');
      all+='=== '+f.name+' ===\n'+t+'\n\n';
    }
    if(all)$('text').value=all;msg.textContent=all?'Materiali letti: controlla il testo qui sopra e crea il piano.':'';
  }catch(err){msg.className='msg err';msg.textContent=err.message||'Impossibile leggere il file.'}
});

function buildPlan(cs,days,daily){
  const load=Array(days).fill(0),out=[];
  const add=(i,t)=>{out.push({...t,day:i,done:false});load[i]+=t.minutes};
  const learnEnd=Math.max(1,Math.floor(days*.6));let d=0;
  for(const c of cs){
    const m=c.minutes;
    while(d<learnEnd-1&&load[d]+m>daily)d++;
    add(d,{kind:'learn',title:'Studia: '+c.title,minutes:m});
    for(const g of(c.difficulty>=4?[1,3,6,12]:[2,7])){
      let r=d+g;while(r<days-1&&load[r]+10>daily)r++;
      if(r<days)add(r,{kind:'review',title:'Ripassa: '+c.title,minutes:10});
    }
  }
  if(days>=3)add(days-2,{kind:'mock',title:'Simulazione d’esame',minutes:Math.min(60,daily)});
  [...cs].sort((a,b)=>b.difficulty-a.difficulty).slice(0,5).forEach(c=>add(days-1,{kind:'review',title:'Ripasso finale: '+c.title,minutes:10}));
  return out.sort((a,b)=>a.day-b.day);
}

function render(){
  const byDay={};tasks.forEach((t,i)=>(byDay[t.day]??=[]).push([t,i]));
  $('plan').innerHTML='';
  for(const [day,list] of Object.entries(byDay)){
    const dt=new Date(today);dt.setDate(dt.getDate()+Number(day));
    const row=document.createElement('div');row.className='day';
    const h=document.createElement('h3');
    h.append(dt.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}),document.createElement('br'));
    const s=document.createElement('small');s.textContent=list.reduce((a,[t])=>a+t.minutes,0)+' min';h.append(s);
    const col=document.createElement('div');
    for(const [t,i] of list){
      const el=document.createElement('div');el.className='task '+t.kind+(t.done?' done':'');
      const lb=document.createElement('label');
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
      cb.onchange=()=>{t.done=cb.checked;render()};
      const sp=document.createElement('span');sp.textContent=t.title;
      const em=document.createElement('em');em.textContent=t.minutes+' min';
      lb.append(cb,sp);el.append(lb,em);col.append(el);
    }
    row.append(h,col);$('plan').append(row);
  }
  const done=tasks.filter(t=>t.done).length;
  $('count').textContent=done+' di '+tasks.length+' attività';
  $('prog').style.width=(tasks.length?done/tasks.length*100:0)+'%';
}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=$('msg');msg.className='msg';msg.textContent='';
  if(WORKER_URL.includes('INSERISCI-QUI')){
    msg.className='msg err';
    msg.textContent='Inserisci prima l’URL del tuo Cloudflare Worker nel codice (variabile WORKER_URL).';
    return;
  }
  today=new Date();today.setHours(0,0,0,0);
  const exam=new Date($('date').value+'T00:00:00');
  const days=Math.max(1,Math.ceil((exam-today)/864e5));
  const daily=Math.max(15,Number($('mins').value)||90);
  $('go').disabled=true;msg.textContent='Sto analizzando il materiale con Gemini…';
  try{
    const prompt=
      'Sei un tutor universitario. Dal materiale seguente estrai i concetti chiave in ordine didattico (massimo 20). '+
      'Rispondi esclusivamente con un array JSON valido, senza testo aggiuntivo né markdown: '+
      '[{"title":string,"summary":string (2 frasi),"difficulty":intero 1-5,"minutes":intero 10-45 (tempo di studio)}]. '+
      'Usa solo ciò che c’è nel materiale e scrivi nella sua lingua.\n\nMATERIALE:\n'+$('text').value.slice(0,60000);
    const res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const data=await res.json();
    if(!res.ok||data.error)throw new Error(data.error||'Errore di connessione al server.');
    if(data.raw?.error)throw new Error(data.raw.error.message||'Errore API Gemini.');
    const clean=(data.text||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    concepts=JSON.parse(clean);
    if(!Array.isArray(concepts)||!concepts.length)throw new Error('Nessun concetto trovato: prova con più testo.');
    concepts=concepts.map(c=>({title:String(c.title),summary:String(c.summary||''),difficulty:Math.min(5,Math.max(1,+c.difficulty||3)),minutes:Math.min(45,Math.max(10,+c.minutes||25))}));
    tasks=buildPlan(concepts,days,daily);
    $('what').textContent=$('title').value+' · '+days+(days===1?' giorno':' giorni')+' all’esame';
    $('cons').innerHTML='';
    concepts.forEach(c=>{const p=document.createElement('p');const b=document.createElement('strong');b.textContent=c.title+'. ';p.append(b,c.summary);$('cons').append(p)});
    $('out').hidden=false;render();msg.textContent='';
    $('out').scrollIntoView({behavior:'smooth'});
  }catch(err){
    msg.className='msg err';
    msg.textContent=err.message||'Qualcosa è andato storto durante l’analisi. Riprova.';
  }finally{$('go').disabled=false}
});
</script>
</body>
</html>
